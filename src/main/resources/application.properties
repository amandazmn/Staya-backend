spring.application.name=staya

# Banco de dados (sobrescreva via variáveis de ambiente fora do ambiente local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/staya}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

# O schema é versionado pelo Flyway (src/main/resources/db/migration);
# o Hibernate apenas valida se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
