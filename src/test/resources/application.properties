spring.application.name=staya-test

# Banco em memória para os testes (não precisa de MySQL rodando)
spring.datasource.url=jdbc:h2:mem:staya;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
