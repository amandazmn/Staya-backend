services:
  mysql:
    image: mysql:8.4
    container_name: staya-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: staya
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      TZ: America/Sao_Paulo
    ports:
      - "3307:3306"
    volumes:
      - staya-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  staya-mysql-data:
